# Reverse proxy Apache para wa-api.sincosto.xyz -> 127.0.0.1:3005
# Cloudflare termina HTTPS, este vhost solo escucha HTTP plano detras de CF.
# El instalador (deploy.sh) copia este archivo a /etc/apache2/sites-available/wa-api.conf

<VirtualHost *:80>
    ServerName wa-api.sincosto.xyz

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket / streaming (por si se agrega despues)
    ProxyPass        / http://127.0.0.1:3005/
    ProxyPassReverse / http://127.0.0.1:3005/

    # Timeouts grandes para envio de archivos
    ProxyTimeout 600
    Timeout 600

    # Tamano maximo del request (25 MB)
    LimitRequestBody 26214400

    # Log dedicado del subdominio
    ErrorLog ${APACHE_LOG_DIR}/wa-api-error.log
    CustomLog ${APACHE_LOG_DIR}/wa-api-access.log combined
</VirtualHost>
