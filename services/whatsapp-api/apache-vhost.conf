# Reverse proxy Apache para __SERVER_NAME__ -> 127.0.0.1:3005
# Apache queda en HTTP plano. El SSL lo termina el reverse-proxy externo
# (Nginx Proxy Manager / Cloudflare / certbot --apache si MANAGE_SSL=1).
# El instalador (deploy.sh) sustituye __SERVER_NAME__ con el WA_DOMAIN real.

<VirtualHost *:80>
    ServerName __SERVER_NAME__

    # Que Apache vea IP real del cliente cuando hay reverse-proxy delante
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 127.0.0.1/8
    RemoteIPTrustedProxy 10.0.0.0/8
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 192.168.0.0/16

    ProxyPreserveHost On
    ProxyRequests Off

    # WebSocket / streaming (por si se agrega despues)
    ProxyPass        / http://127.0.0.1:3005/
    ProxyPassReverse / http://127.0.0.1:3005/

    # Timeouts grandes para envio de archivos
    ProxyTimeout 600
    Timeout 600

    # Tamano maximo del request (25 MB)
    LimitRequestBody 26214400

    # Log dedicado del subdominio
    ErrorLog ${APACHE_LOG_DIR}/wa-api-error.log
    CustomLog ${APACHE_LOG_DIR}/wa-api-access.log combined
</VirtualHost>
